name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WearTimerStopwatch-v1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WearTimerStopwatch-apk
          path: WearTimerStopwatch-v1.${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: v1.${{ github.run_number }}
          body: Sideloadable APK built from commit ${{ github.sha }}
          files: WearTimerStopwatch-v1.${{ github.run_number }}.apk
          make_latest: true
